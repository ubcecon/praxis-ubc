<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Praxis Content Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-min.js" crossorigin="anonymous"></script>

<style>
/* =========================================================================
   COLOR PALETTE — same Comet variables used elsewhere in the project.
   ========================================================================= */
:root {
  --color-bg: #FFFFFF;
  --color-surface: #f8f9fa;
  --color-fg: #041746;
  --color-fg-muted: #7D7D7D;
  --color-tooltip-border: rgba(0, 0, 0, 0.1);
  --color-link: #0052cc;
  --color-node: #00AADD;       /* all nodes, default state */
  --color-connector: #7D7D7D;       /* all connector lines, default state */
  --color-connector-hover: #041746; /* connector lines touching the hovered node */
  --color-accent: #041746;          /* selected-category node + nav highlight */
}

* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--color-bg); color: var(--color-fg); }

#category-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--color-tooltip-border); }
#category-nav div {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-tooltip-border);
  background: var(--color-surface); font-size: 13px; cursor: pointer; color: var(--color-fg);
}
#category-nav div.highlight { background: var(--color-accent); border-color: var(--color-accent); color: #ffffff; }

main { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }

#course-map {
  position: relative; flex: 1 1 65%; height: 640px;
  border: 1px solid var(--color-tooltip-border); border-radius: 8px;
  background: var(--color-surface); overflow: hidden;
}
#course-map svg { display: block; }

aside { flex: 1 1 35%; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
.panel { border: 1px solid var(--color-tooltip-border); border-radius: 8px; background: var(--color-surface); padding: 14px 16px; font-size: 13px; line-height: 1.5; }
.panel h3, .panel h4 { margin: 0 0 6px 0; }
.panel p { margin: 0 0 8px 0; }
.panel .muted { color: var(--color-fg-muted); font-size: 12px; }
#category-panel { border: none; background: transparent; padding: 4px 4px 0 4px; }

/* Matches the site's index-listing cards (thumbnail + title + description
   + date) — same treatment, just a single card instead of a grid, shown
   here for whatever node is currently hovered. */
#item-info {
  padding: 0;
  overflow: hidden;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  /* Hover-lift, ported from the site's listing-card style.css — same
     effect, just retargeted to this card's own markup since there's no
     Quarto grid/link wrapper here to hang .quarto-grid-item/-link off of. */
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
#item-info:hover {
  transform: translateY(-6px);
  box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.25);
}
#item-info .item-thumb {
  width: 100%; height: 140px; display: block;
  object-fit: contain; background: #FFFFFF;
  transition: transform 0.3s ease;
}
#item-info:hover .item-thumb {
  transform: scale(1.04);
}
.item-thumb-wrap { position: relative; }
#item-info .item-thumb.clickable { cursor: pointer; }
/* Language-version toggle for Learn to Research nodes (R / Stata /
   PyStata). UI only for now — buttons just switch which one looks
   active; nothing behind them is wired to real paths yet. */
.lang-toggle {
  position: absolute; top: 8px; right: 8px;
  display: flex; gap: 4px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 999px; padding: 3px;
}
.lang-btn {
  border: none; background: transparent; cursor: pointer;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.02em;
  padding: 4px 8px; border-radius: 999px; color: var(--color-fg-muted);
}
.lang-btn:hover { color: var(--color-fg); }
.lang-btn.active { background: var(--color-accent); color: #ffffff; }
@media (prefers-reduced-motion: reduce) {
  #item-info, #item-info .item-thumb { transition: none; }
  #item-info:hover { transform: none; box-shadow: none; }
  #item-info:hover .item-thumb { transform: none; }
}
#item-info .item-body { padding: 14px 16px; }
#item-info .item-body.clickable { cursor: pointer; }
#item-info .item-body h4 { font-size: 14px; line-height: 1.35; margin: 0 0 6px 0; }
#item-info .item-desc {
  font-size: 12.5px; color: var(--color-fg-muted); line-height: 1.5; margin: 0 0 10px 0;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  line-clamp: 4; /* standardized property alongside the legacy -webkit- one, for tooling/lint compatibility */
}
#item-info .item-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#item-info .item-date { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg-muted); white-space: nowrap; }
#item-info .item-placeholder-body { padding: 14px 16px; }
</style>
</head>
<body>

<div id="category-nav"></div>

<main>
  <div id="course-map"><svg></svg></div>
  <aside>
    <div class="panel" id="category-panel">
      <div id="category-info"></div>
    </div>
    <div class="panel" id="item-info"></div>
  </aside>
</main>

<script type="text/template" id="category-info-template">
  <h3><%= name %></h3>
  <p>There <%= total === 1 ? "is" : "are" %> <%= total %> node<%= total === 1 ? "" : "s" %> in this category.</p>
</script>

<script type="text/template" id="item-info-template">
  <% if (code) { %>
    <div class="item-thumb-wrap">
      <img class="item-thumb<% if (path) { %> clickable<% } %>" src="index/placeholder_images/placeholder.png" alt=""<% if (path) { %> title="Open this notebook"<% } %>>
      <% if (categoryId === "research") { %>
        <div class="lang-toggle" role="group" aria-label="Notebook language">
          <button type="button" class="lang-btn<%= activeLang === "r" ? " active" : "" %>" data-lang="r">R</button>
          <button type="button" class="lang-btn<%= activeLang === "stata" ? " active" : "" %>" data-lang="stata">Stata</button>
          <button type="button" class="lang-btn<%= activeLang === "pystata" ? " active" : "" %>" data-lang="pystata">PyStata</button>
        </div>
      <% } %>
    </div>
    <div class="item-body<% if (path) { %> clickable<% } %>"<% if (path) { %> title="Open this notebook"<% } %>>
      <h4><%= title %></h4>
      <p class="item-desc"><%= description ? description : "No description available yet." %></p>
      <div class="item-meta">
        <span class="muted"><%= category %></span>
        <% if (date) { %><span class="item-date"><%= date %></span><% } %>
      </div>
      <% if (courses && courses.length) { %><p class="muted" style="margin-top:6px;">Also in: <%= courses.join(", ") %></p><% } %>
    </div>
  <% } else { %>
    <div class="item-placeholder-body">
      <h4>Praxis Content Map</h4>
      <p>Hover any node to see which file it is. Click a category above to highlight what falls under it.</p>
    </div>
  <% } %>
</script>

  if (custom) Object.values(custom).forEach(v => { if (v.level > maxLevel) maxLevel = v.level; });

  const step = maxLevel > 0 ? ceiling / maxLevel : 0.28;

    allNodes.push({ ...item, categoryId: cat.id, categoryName: cat.name, x, y });

/* =========================================================================

   ========================================================================= */
(function () {
  const width = parseInt(d3.select("#course-map").style("width"));
  const height = parseInt(d3.select("#course-map").style("height")) - 20;
  const xscale = width / 20;
  const yscale = height / (ROW_ORDER.length + 1.5); // auto-scales as rows are added
  const xcoord = x => x * xscale + width / 2;
  const ycoord = y => height - y * yscale - 0.9 * yscale;

  // Which nodes actually participate in a prerequisite edge at all —
  // used below to anchor isolated nodes (no stated prereqs, e.g. most
  // course items) more tightly to their category position instead of
  // letting collision-avoidance scatter them away from their siblings.
  const hasConnections = new Set();
  CONNECTIONS.forEach(c => { hasConnections.add(c.from); hasConnections.add(c.to); });

  // Small deterministic per-node offset (stable across reloads, not truly
  // random) so siblings that share an anchor level don't all land on
  // exactly the same y — a dead-flat horizontal row of nodes reads as
  // mechanical/gridded rather than organic.
  function hashJitter(code, range) {
    let h = 0;
    for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) | 0;
    return ((Math.abs(h) % 1000) / 1000 - 0.5) * range;
  }

  // Anchor each node at its category-row position, then let a force
  // simulation relax the layout: forceLink pulls prerequisite-connected
  // nodes toward each other (so chains sprawl outward into whatever open
  // space exists instead of stacking in a straight line), and forceCollide
  // enforces a hard minimum distance so nothing overlaps. forceX/forceY
  // keep everything from drifting too far from its category row — strong
  // vertically (rows stay recognizable), weak horizontally (free to spread) —
  // and stronger still for isolated nodes, so they stay clustered near the
  // rest of their category/course instead of drifting off alone.
  allNodes.forEach(d => {
    d.ax = xcoord(d.x) + hashJitter(d.code + "x", 10);
    d.ay = ycoord(d.y) + hashJitter(d.code + "y", 16);
    d.x = d.ax;
    d.y = d.ay;
  });
  const MIN_NODE_DISTANCE = 26;

  // Origin is GS-JN's anchor position — the true root of the graph (nearly
  // everything traces back to it directly or indirectly) — rather than an
  // arbitrary canvas-center point. Uses its fixed anchor (ax/ay), not its
  // live simulated position, so the origin doesn't move out from under the
  // simulation while it's running.
  const gsjnNode = allNodes.find(d => d.code === "GS-JN");
  const origin = gsjnNode ? { x: gsjnNode.ax, y: gsjnNode.ay } : { x: width / 2, y: height / 2 };

  // Custom force: every node must be farther from the origin than whatever
  // it directly requires. Without this, forceLink + forceCollide can end up
  // shoving a downstream node (e.g. one of RS08's many children) back
  // toward the center, past its own prerequisite — reading as the chain
  // folding back into itself instead of sprawling outward. This runs
  // alongside the other forces each tick and just nudges velocity, same as
  // any other d3-force.
  const RADIAL_GAP = 22; // minimum extra distance from origin a node must keep over its prereq
  function forceRadialOrder(alpha) {
    CONNECTIONS.forEach(c => {
      const s = c.source, t = c.target;
      const sDist = Math.hypot(s.x - origin.x, s.y - origin.y);
      const tDist = Math.hypot(t.x - origin.x, t.y - origin.y) || 0.001;
      const minDist = sDist + RADIAL_GAP;
      if (tDist < minDist) {
        const ux = (t.x - origin.x) / tDist, uy = (t.y - origin.y) / tDist;
        const push = (minDist - tDist) * alpha * 5;
        t.vx = (t.vx || 0) + ux * push;
        t.vy = (t.vy || 0) + uy * push;
      }
    });
  }

  // Custom force: a node must sit visually *above* (smaller pixel y) each
  // thing it directly requires — e.g. RS08's children (RS09, RS14, ...)
  // should read as sitting above RS08, not level with or below it.
  const VERTICAL_GAP = 30;
  function forceVerticalOrder(alpha) {
    CONNECTIONS.forEach(c => {
      const s = c.source, t = c.target;
      if (t.y > s.y - VERTICAL_GAP) {
        const push = (s.y - VERTICAL_GAP - t.y) * alpha * 5;
        t.vy = (t.vy || 0) + push;
      }
    });
  }

  // Weak global cohesion, pulling everything toward GS-JN's x — same fix
  // as before (keeps the graph from splitting into a left mass and a right
  // mass), just now centered on the actual root node instead of an
  // arbitrary canvas point. Still horizontal-only: vertical position is
  // meaningful (foundational content low, advanced high), so pulling
  // toward a fixed vertical center would fight the ordering forces above.
  const gravityX = d3.forceX(origin.x).strength(0.018);

  // forceLink pulls every connected pair together, but a node with
  // prerequisites in more than one category (e.g. RS10 needs both RS08,
  // same category, and IE01, a different one) should sit closer to the
  // same-category prereq than the cross-category one. Same-category edges
  // get a stronger pull; cross-category edges a weaker one. This also
  // directly helps "Learn to Research" read as one cohesive cluster:
  // its many internal (research-to-research) links now pull harder than
  // its external links out to Getting Started / Intermediate Econometrics
  // / etc., instead of every connection competing equally.
  const linkForce = d3.forceLink(CONNECTIONS).id(d => d.code).distance(46)
    .strength(l => (l.source.categoryId === l.target.categoryId ? 0.35 : 0.1));

  const sim = d3.forceSimulation(allNodes)
    .force("x", d3.forceX(d => d.ax).strength(d => (hasConnections.has(d.code) ? 0.25 : 0.5)))
    .force("y", d3.forceY(d => d.ay).strength(d => (hasConnections.has(d.code) ? 0.7 : 0.9)))
    .force("link", linkForce)
    .force("collide", d3.forceCollide(MIN_NODE_DISTANCE / 2))
    .force("radialOrder", forceRadialOrder)
    .force("verticalOrder", forceVerticalOrder)
    .force("gravityX", gravityX)
    .stop();

  // Hard boundary clamp, applied every tick: whatever the forces above do,
  // no node is allowed to end up outside the visible canvas.
  const EDGE_MARGIN = 16;
  function clampToBounds() {
    allNodes.forEach(d => {
      d.x = Math.max(EDGE_MARGIN, Math.min(width - EDGE_MARGIN, d.x));
      d.y = Math.max(EDGE_MARGIN, Math.min(height - EDGE_MARGIN, d.y));
    });
  }
  for (let i = 0; i < 700; i++) { sim.tick(); clampToBounds(); }

  const svg = d3.select("#course-map svg").attr("width", width).attr("height", height);
  const linkLayer = svg.append("g").attr("fill", "none").attr("stroke-width", 1.5);
  const nodeLayer = svg.append("g");
  const hitLayer = svg.append("g");

  function colors() {
    const s = getComputedStyle(document.documentElement);
    const v = n => s.getPropertyValue(n).trim();
    return {
      bg: v("--color-bg"), fg: v("--color-fg"), fgMuted: v("--color-fg-muted"),
      node: v("--color-node"), connector: v("--color-connector"), connectorHover: v("--color-connector-hover"), accent: v("--color-accent")
    };
  }

  const categoryInfoDiv = d3.select("#category-info");
  const categoryInfoTemplate = _.template(d3.select("#category-info-template").html());
  const itemInfoDiv = d3.select("#item-info");
  const itemInfoTemplate = _.template(d3.select("#item-info-template").html());

  // Learn to Research language-version toggle (R / Stata / PyStata).
  // Delegated on the container since the card's contents are replaced
  // wholesale on every hover — a listener bound to the buttons directly
  // would need re-attaching each time, this doesn't.
  //
  // Same delegation also handles clicking the thumbnail/title/description:
  // navigates to the node's real page, when it has one, using whichever
  // language is currently selected. Paths in the data (e.g.
  // "docs/2_Beginner/...") are relative to the project root, and this file
  // sits one level down in pages/, hence the "../" prefix. Navigates
  // window.top rather than just this iframe, so clicking actually takes
  // the visitor to the notebook instead of loading it inside the small
  // map iframe.
  let currentHoveredNode = null;
  let currentLang = "r";
  function openNotebook(path) {
    const url = "../" + path;
    try { (window.top || window).location.href = url; }
    catch (e) { window.location.href = url; }
  }
  // Resolves the title/path actually being shown right now: the node's
  // language-specific version if it's a Research node with langVersions
  // data for the selected language, otherwise just the node's own
  // title/path as normal.
  function resolveVersion(d, lang) {
    if (d.langVersions && d.langVersions[lang]) return d.langVersions[lang];
    return { title: d.title, path: d.path };
  }
  function renderItemCard(d, lang) {
    currentHoveredNode = d;
    currentLang = lang;
    const v = resolveVersion(d, lang);
    itemInfoDiv.html(itemInfoTemplate({
      code: d.code, title: v.title, category: d.categoryName, categoryId: d.categoryId, path: v.path,
      description: d.description || null, date: d.date || null,
      courses: categoriesReferencingCode[d.code] || [],
      activeLang: lang
    }));
  }
  itemInfoDiv.on("click", event => {
    const navTarget = event.target.closest(".item-thumb.clickable, .item-body.clickable");
    if (navTarget && currentHoveredNode) {
      const v = resolveVersion(currentHoveredNode, currentLang);
      if (v.path) openNotebook(v.path);
      return;
    }
    const btn = event.target.closest(".lang-btn");
    if (!btn || !currentHoveredNode) return;
    renderItemCard(currentHoveredNode, btn.dataset.lang);
  });

  // All shows the total across the whole map (it's a catch-all, not a
  // filtered subset); every other category shows its own item + cross-
  // referenced count.
  function categoryNodeCount(cat) {
    return cat.id === "all" ? allNodes.length : cat.items.length + (cat.highlightCodes ? cat.highlightCodes.length : 0);
  }

  let currentCategory = CATEGORIES[0];

  const nav = d3.select("#category-nav");
  CATEGORIES.forEach(cat => {
    nav.append("div").html(cat.name).on("click", function () {
      d3.select("#category-nav div.highlight").classed("highlight", false);
      d3.select(this).classed("highlight", true);
      currentCategory = cat;
      render(300);
      categoryInfoDiv.html(categoryInfoTemplate({
        name: cat.name,
        total: categoryNodeCount(cat)
      }));
    });
  });

  function showItemInfo(event, d) {
    renderItemCard(d, "r"); // fresh hover always starts back on the R version
    // Highlight only this node's own prerequisites — edges where it's the
    // target (requires something), not edges where it's the source (is a
    // prerequisite for something else). E.g. hovering RS08 highlights
    // RS05→RS08, not RS08→RS09/RS08→RS10/etc.
    const col = colors();
    const isOwnPrereq = conn => conn.to === d.code;
    linkLayer.selectAll("line")
      .transition().duration(150)
      .attr("stroke", conn => (isOwnPrereq(conn) ? col.connectorHover : col.connector))
      .attr("stroke-width", conn => (isOwnPrereq(conn) ? 3 : 1.5))
      .attr("opacity", conn => (isOwnPrereq(conn) ? 1 : 0.1));
  }
  // No mouseout handler — per request, whatever a hover reveals (the info
  // card and the highlighted prerequisite lines) stays on screen until a
  // different node is hovered, rather than resetting when the mouse leaves.

  function render(duration) {
    const c = colors();

    // A node is highlighted if it's owned by the selected category, or
    // cross-referenced by it via highlightCodes (e.g. selecting ECON 325
    // highlights the Beginner Intro to Statistics nodes it points at).
    // "All" is the one exception: it never highlights anything, even its
    // own nodes — it's a home for uncategorized notebooks, not a filter.
    function isHighlighted(d) {
      if (currentCategory.id === "all") return false;
      return d.categoryId === currentCategory.id ||
        (currentCategory.highlightCodes && currentCategory.highlightCodes.includes(d.code));
    }

    linkLayer.selectAll("line")
      .data(CONNECTIONS, d => d.from + "->" + d.to)
      .join(
        enter => enter.append("line")
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
          .attr("stroke", c.connector)
          .attr("opacity", 0)
          .transition().duration(duration)
          .attr("opacity", 0.5),
        update => update.transition().duration(duration)
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
          .attr("stroke", c.connector)
          .attr("opacity", 0.5)
      );

    nodeLayer.selectAll("circle")
      .data(allNodes, d => d.code)
      .join(
        enter => enter.append("circle")
          .attr("r", 10)
          .attr("cx", d => d.x).attr("cy", d => d.y)
          .attr("fill", d => (isHighlighted(d) ? c.accent : c.node))
          .attr("stroke", d => (isHighlighted(d) ? c.accent : c.node))
          .attr("stroke-width", 1.5)
          .attr("opacity", 0)
          .transition().duration(duration).attr("opacity", 1),
        update => update.transition().duration(duration)
          .attr("fill", d => (isHighlighted(d) ? c.accent : c.node))
          .attr("stroke", d => (isHighlighted(d) ? c.accent : c.node))
      );

    // Node codes stay on each node's data (d.code) for internal wiring —
    // keying, connection lookups, the hover card — but aren't drawn as
    // visible text on the map itself.

    hitLayer.selectAll("circle")
      .data(allNodes, d => d.code)
      .join(enter => enter.append("circle")
        .attr("r", 10).attr("fill", "transparent")
        .attr("cx", d => d.x).attr("cy", d => d.y)
        .on("mouseover", showItemInfo));
  }

  render(0);
  categoryInfoDiv.html(categoryInfoTemplate({
    name: currentCategory.name,
    total: categoryNodeCount(currentCategory)
  }));
  itemInfoDiv.html(itemInfoTemplate({ code: null, title: null, category: null, categoryId: null, path: null, description: null, date: null, courses: [], activeLang: null }));
  d3.select("#category-nav div:nth-child(1)").classed("highlight", true);
})();
</script>
</body>
</html>
