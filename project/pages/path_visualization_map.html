<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Praxis Content Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-min.js" crossorigin="anonymous"></script>

<style>
/* =========================================================================
   COLOR PALETTE — same Comet variables used elsewhere in the project.
   ========================================================================= */
:root {
  --color-bg: #FFFFFF;
  --color-surface: #f8f9fa;
  --color-fg: #041746;
  --color-fg-muted: #7D7D7D;
  --color-tooltip-border: rgba(0, 0, 0, 0.1);
  --color-link: #0052cc;
  --chart-1: #0052cc; /* highlight for the selected category */
}

* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--color-bg); color: var(--color-fg); }

#category-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--color-tooltip-border); }
#category-nav div {
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-tooltip-border);
  background: var(--color-surface); font-size: 13px; cursor: pointer; color: var(--color-fg);
}
#category-nav div.highlight { background: var(--chart-1); border-color: var(--chart-1); color: #ffffff; }

main { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }

#course-map {
  position: relative; flex: 1 1 65%; height: 640px;
  border: 1px solid var(--color-tooltip-border); border-radius: 8px;
  background: var(--color-surface); overflow: hidden;
}
#course-map svg { display: block; }

aside { flex: 1 1 35%; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
.panel { border: 1px solid var(--color-tooltip-border); border-radius: 8px; background: var(--color-surface); padding: 14px 16px; font-size: 13px; line-height: 1.5; }
.panel h3, .panel h4 { margin: 0 0 6px 0; }
.panel p { margin: 0 0 8px 0; }
.panel .muted { color: var(--color-fg-muted); font-size: 12px; }

/* Matches the site's index-listing cards (thumbnail + title + description
   + date) — same treatment, just a single card instead of a grid, shown
   here for whatever node is currently hovered. */
#item-info {
  padding: 0;
  overflow: hidden;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}
#item-info .item-thumb {
  width: 100%; height: 140px; display: block;
  background: linear-gradient(90deg, #0052cc 0%, #0052cc 50%, #041746 50%, #041746 100%);
}
#item-info .item-body { padding: 14px 16px; }
#item-info .item-body h4 { font-size: 14px; line-height: 1.35; margin: 0 0 6px 0; }
#item-info .item-desc {
  font-size: 12.5px; color: var(--color-fg-muted); line-height: 1.5; margin: 0 0 10px 0;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  line-clamp: 4; /* standardized property alongside the legacy -webkit- one, for tooling/lint compatibility */
}
#item-info .item-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#item-info .item-date { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg-muted); white-space: nowrap; }
#item-info .item-placeholder-body { padding: 14px 16px; }
</style>
</head>
<body>

<div id="category-nav"></div>

<main>
  <div id="course-map"><svg></svg></div>
  <aside>
    <div class="panel" id="category-panel">
      <div id="category-info"></div>
    </div>
    <div class="panel" id="item-info"></div>
  </aside>
</main>

<script type="text/template" id="category-info-template">
  <h3><%= name %></h3>
  <p><%= description %></p>
  <% if (noHighlight) { %>
    <p class="muted">These nodes aren't highlighted — this category is just a home for them, not a filter.</p>
  <% } else if (total === 0) { %>
    <p class="muted">Nothing highlighted for this view.</p>
  <% } else { %>
    <p class="muted"><%= total %> file<%= total === 1 ? "" : "s" %> in this category<% if (ownCount === 0) { %> (all cross-referenced from other categories)<% } %></p>
  <% } %>
</script>

<script type="text/template" id="item-info-template">
  <% if (code) { %>
    <div class="item-thumb"></div>
    <div class="item-body">
      <h4><%= title %></h4>
      <p class="item-desc"><%= description ? description : "No description available yet." %></p>
      <div class="item-meta">
        <span class="muted"><%= code %> · <%= category %></span>
        <% if (date) { %><span class="item-date"><%= date %></span><% } %>
      </div>
      <% if (courses && courses.length) { %><p class="muted" style="margin-top:6px;">Also in: <%= courses.join(", ") %></p><% } %>
    </div>
  <% } else { %>
    <div class="item-placeholder-body">
      <h4>Praxis Content Map</h4>
      <p>Hover any node to see which file it is. Click a category above to highlight what falls under it.</p>
    </div>
  <% } %>
</script>

<script>

      { code: "IG03", title: "Lab 05 — Chi-square", path: "docs/3_Intermediate/geog_374/Lab_05_Chisquare/Lab_05_Chisquare.html" },
      { code: "IG04", title: "Lab 06 — T-test", path: "docs/3_Intermediate/geog_374/Lab_06_Ttest/Lab_06_Ttest.html" },

// Row order, bottom to top (y = 0 is lowest on screen). Only categories

// appear here at all; they just highlight nodes that already live in
// another row.
const ROW_ORDER = [
  "getting-started", "beginner", "intermediate-econ", "intermediate-geo", "advanced", "research",
  "soci-280", "econ-227", "amne-376", "hist-414", "soci-415", "all"
];

// Most categories just spread their items evenly across x within their row.
// A few have real prerequisite structure, so they get a small hand-placed
// DAG layout instead: level 0 = no prerequisites, and each level up
// depends on something in the level below.
const CUSTOM_LAYOUTS = {
  "getting-started": {
    "GS-JN": { level: 0, x: 0 },
    "GS-PY": { level: 1, x: -3 },
    "GS-R":  { level: 1, x: 3 },
    "GS-D1": { level: 2, x: 0 },
    "GS-D2": { level: 3, x: 0 }

  "intermediate-econ": {

    "IE02": { level: 1, x: -3 },
    "IE04": { level: 1, x: 3 },
    "IE03": { level: 2, x: -4.5 },
    "IE05": { level: 2, x: -1.5 }
  },
  "beginner": {
    "B01": { level: 0, x: -8 },
    "B02": { level: 0, x: -4.5 },
    "B03": { level: 0, x: -1 },
    "B08": { level: 0, x: 6 },
    "B04": { level: 1, x: 6 },
    "B09": { level: 1, x: 9 },
    "B10": { level: 2, x: 6 },
    "B05": { level: 3, x: 6 },
    "B06": { level: 4, x: 4 },
    "B11": { level: 4, x: 8 },
    "B07": { level: 5, x: 4 }
  },
  "advanced": {
    "A01": { level: 0, x: -9 },    "A02": { level: 1, x: -9 },
    "A06": { level: 1, x: -7.4 },  "A05": { level: 0, x: -5.8 },
    "A03": { level: 0, x: -4.2 },  "A04": { level: 1, x: -4.2 },
    "A07": { level: 0, x: -2.6 },  "A08": { level: 1, x: -2.6 },
    "A09": { level: 0, x: -0.4 },
    "A10": { level: 0, x: 0.8 },
    "A11": { level: 0, x: 2.1 },
    "A12": { level: 0, x: 3.3 },
    "A13": { level: 0, x: 4.5 },
    "A14": { level: 0, x: 5.7 },
    "A15": { level: 0, x: 7.0 },
    "A16": { level: 0, x: 8.2 },
    "A17": { level: 0, x: 9.4 }, "A18": { level: 1, x: 9.4 }, "A19": { level: 2, x: 9.4 }
  },
  "research": {
    "RS01": { level: 0, x: 0 },
    "RS02": { level: 1, x: 0 },
    "RS03": { level: 2, x: 0 },
    "RS04": { level: 3, x: 0 },
    "RS05": { level: 4, x: 0 },
    "RS06": { level: 5, x: -4 },
    "RS07": { level: 6, x: -4 },
    "RS08": { level: 5, x: 3 },
    "RS09": { level: 6, x: -2 },
    "RS10": { level: 6, x: -0.6 },
    "RS11": { level: 6, x: 0.85 },
    "RS12": { level: 6, x: 2.3 },
    "RS13": { level: 6, x: 3.7 },
    "RS14": { level: 6, x: 5.1 },
    "RS15": { level: 6, x: 6.6 },
    "RS16": { level: 6, x: 8.0 },
    "RS17": { level: 6, x: 9.4 }
  },
  // SOCI 415: CBDB Dataset sits above KINMATRIX (its prerequisite);
  // Introduction to Network Analysis is independent, off to the side.
  "soci-415": {
    "SOCI415-A": { level: 0, x: -3 },
    "SOCI415-B": { level: 0, x: 3 },
    "SOCI415-C": { level: 1, x: 3 }
  }
};

const allNodes = [];
CATEGORIES.forEach(cat => {
  const rowY = ROW_ORDER.indexOf(cat.id);
  const custom = CUSTOM_LAYOUTS[cat.id];
  const n = cat.items.length;
  // Normalize the vertical step so the tallest chain in this category's
  // tree still fits within the row band (max offset ~0.85), no matter how
  // many levels it ends up with.
  let maxLevel = 0;
  if (custom) Object.values(custom).forEach(v => { if (v.level > maxLevel) maxLevel = v.level; });
  const step = maxLevel > 0 ? 0.85 / maxLevel : 0.28;
  cat.items.forEach((item, i) => {
    let x, y;
    if (custom && custom[item.code]) {
      x = custom[item.code].x;
      y = rowY + custom[item.code].level * step;
    } else {
      x = n === 1 ? 0 : -9 + i * (18 / (n - 1));
      y = rowY;
    }
    allNodes.push({ ...item, categoryId: cat.id, categoryName: cat.name, x, y });
  });
});

const nodeByCode = Object.fromEntries(allNodes.map(n => [n.code, n]));

// Reverse lookup: which categories (by name) cross-reference a given node
// code via highlightCodes. Powers the "Also in: ..." line in the hover
// panel — e.g. hovering Intro to Statistics II shows both ECON 325 and
// ECON 226/227, since both reference it without owning it.
const categoriesReferencingCode = {};
CATEGORIES.forEach(cat => {
  (cat.highlightCodes || []).forEach(code => {
    (categoriesReferencingCode[code] = categoriesReferencingCode[code] || []).push(cat.name);
  });
});

const CONNECTIONS = [
  // Getting Started
  { from: "GS-JN", to: "GS-PY" },
  { from: "GS-JN", to: "GS-R" },
  { from: "GS-JN", to: "GS-D1" },
  { from: "GS-R",  to: "GS-D1" },
  { from: "GS-D1", to: "GS-D2" },

  // Intermediate - Econometrics. Intro to Regression's own prerequisites
  // reach back into Getting Started (cross-category — lines still work the
  // same way, they just span rows).
  { from: "GS-R",  to: "IE01" },
  { from: "GS-JN", to: "IE01" },
  { from: "IE01",  to: "IE02" }, // Multiple Regression requires Intro to Regression
  { from: "IE02",  to: "IE03" }, // Interactions & Nonlinear Terms requires Multiple Regression
  { from: "IE01",  to: "IE04" }, // Summary Statistics requires Intro to Regression
  { from: "IE02",  to: "IE05" }, // Issues in Regression requires Multiple Regression

  // Intermediate - Geospatial (GEOG 374 labs)
  { from: "GS-JN", to: "IG01" }, { from: "GS-R", to: "IG01" }, { from: "GS-D2", to: "IG01" },
  { from: "GS-JN", to: "IG02" }, { from: "GS-R", to: "IG02" }, { from: "GS-D2", to: "IG02" },
  { from: "GS-JN", to: "IG03" }, { from: "GS-R", to: "IG03" }, { from: "GS-D2", to: "IG03" },
  { from: "GS-JN", to: "IG04" }, { from: "GS-R", to: "IG04" }, { from: "GS-D2", to: "IG04" },
  { from: "GS-JN", to: "IG05" }, { from: "GS-R", to: "IG05" },

  // Beginner. "Sampling and dependence" read as "Sampling Distributions"
  // (B11), the closest match.
  { from: "GS-JN", to: "B01" },
  { from: "GS-JN", to: "B02" }, { from: "GS-R", to: "B02" },
  { from: "GS-JN", to: "B03" }, { from: "GS-R", to: "B03" }, // Intro to Central Tendency: same as Intro to Statistics II
  { from: "GS-JN", to: "B08" }, { from: "GS-R", to: "B08" }, // Intro to Data Viz I: same as the two above
  { from: "B08", to: "B04" }, // Central Tendency requires Intro to Data Viz I
  { from: "B08", to: "B09" }, // Intro to Data Viz II requires Intro to Data Viz I
  { from: "B04", to: "B10" }, // Distributions requires Central Tendency
  { from: "B10", to: "B05" }, // Dispersion & Dependence requires Distributions
  { from: "B05", to: "B06" }, // Confidence Intervals requires Dispersion & Dependence
  { from: "B05", to: "B11" }, // Sampling Distributions requires Dispersion & Dependence
  { from: "B06", to: "B07" }, // Hypothesis Testing requires Confidence Intervals

  // Advanced. "Expectations and Summary statistics" is read as the
  // Intermediate - Econometrics "Summary Statistics" node (IE04).
  { from: "IE04", to: "A01" }, { from: "GS-D2", to: "A01" }, { from: "IG04", to: "A01" }, // Diff-in-Diff
  { from: "A01", to: "A02" }, // Linear Differencing Models requires Diff-in-Diff
  { from: "IE02", to: "A03" }, // Instrumental Variables I requires Multiple Regression
  { from: "A03", to: "A04" }, // Instrumental Variables II requires IV I
  { from: "IE04", to: "A05" }, // Panel Data requires Summary Statistics
  { from: "A05", to: "A06" }, { from: "A01", to: "A06" }, { from: "IE05", to: "A06" }, // Synthetic Control
  { from: "IE02", to: "A07" }, // Geospatial Analysis I requires Multiple Regression
  { from: "A07", to: "A08" }, // Geospatial Analysis II requires Geospatial Analysis I
  { from: "B04", to: "A09" }, // Classification & Clustering requires Central Tendency
  { from: "GS-JN", to: "A10" }, { from: "GS-R", to: "A10" }, // Sentiment Analysis
  // A11 Transcription: no prerequisites stated
  { from: "GS-JN", to: "A12" }, // Vocalization requires Intro to Jupyter
  { from: "GS-R", to: "A13" }, // Word Embeddings (Python) requires Intro to R, as stated
  { from: "GS-R", to: "A14" }, // Word Embeddings (R) requires Intro to R
  // A15 LLM APIs II, A16 Fine-Tuning: no prerequisites stated
  // A17 Network Analysis Workshop Pre-Reading: no prerequisites stated
  { from: "A17", to: "A18" }, // Network Analysis requires the pre-reading
  { from: "A18", to: "A19" }, // Network Analysis II requires Network Analysis

  // Learn to Research (R version).
  { from: "GS-JN", to: "RS01" }, // Setting Up Jupyter and R
  { from: "RS01", to: "RS02" },  // Working with R Scripts
  { from: "RS02", to: "RS03" },  // R Essentials
  { from: "RS03", to: "RS04" },  // Opening Datasets
  { from: "RS04", to: "RS05" },  // Generating Variables
  { from: "RS05", to: "RS06" },  // Conducting Within Group Analysis
  { from: "RS06", to: "RS07" },  // Combining Data Sets
  { from: "RS05", to: "RS08" },  // Creating Meaningful Visuals
  { from: "RS08", to: "RS09" },  // Combining Graphs
  // The following 7 all require Intro to Regression + Creating Meaningful Visuals:
  { from: "IE01", to: "RS10" }, { from: "RS08", to: "RS10" }, // Conducting Regression Analysis
  { from: "IE01", to: "RS11" }, { from: "RS08", to: "RS11" }, // Exporting Regression Output
  { from: "IE01", to: "RS12" }, { from: "RS08", to: "RS12" }, // Dummy Variables and Interactions
  { from: "IE01", to: "RS13" }, { from: "RS08", to: "RS13" }, // Good Regression Practice
  { from: "IE01", to: "RS14" }, { from: "RS08", to: "RS14" }, // Panel Data Regressions
  { from: "IE01", to: "RS16" }, { from: "RS08", to: "RS16" }, // Instrumental Variable Analysis
  { from: "IE01", to: "RS17" }, { from: "RS08", to: "RS17" }, // R Workflow Guide
  { from: "IE04", to: "RS15" }, { from: "GS-D2", to: "RS15" }, { from: "IG04", to: "RS15" }, { from: "RS08", to: "RS15" }, // Difference-in-Differences Analysis

  // SOCI 415
  { from: "SOCI415-B", to: "SOCI415-C" } // CBDB Dataset requires KINMATRIX Dataset
].map(c => ({ ...c, source: nodeByCode[c.from], target: nodeByCode[c.to] }));

/* =========================================================================
   CHART
   ========================================================================= */
(function () {
  const width = parseInt(d3.select("#course-map").style("width"));
  const height = parseInt(d3.select("#course-map").style("height")) - 20;
  const xscale = width / 20;
  const yscale = height / (ROW_ORDER.length + 1.5); // auto-scales as rows are added
  const xcoord = x => x * xscale + width / 2;
  const ycoord = y => height - y * yscale - 0.9 * yscale;

  // Anchor each node at its category-row position, then let a force
  // simulation relax the layout: forceLink pulls prerequisite-connected
  // nodes toward each other (so chains sprawl outward into whatever open
  // space exists instead of stacking in a straight line), and forceCollide
  // enforces a hard minimum distance so nothing overlaps. forceX/forceY
  // keep everything from drifting too far from its category row — strong
  // vertically (rows stay recognizable), weak horizontally (free to spread).
  allNodes.forEach(d => {
    d.ax = xcoord(d.x);
    d.ay = ycoord(d.y);
    d.x = d.ax;
    d.y = d.ay;
  });
  const MIN_NODE_DISTANCE = 26;
  const sim = d3.forceSimulation(allNodes)
    .force("x", d3.forceX(d => d.ax).strength(0.25))
    .force("y", d3.forceY(d => d.ay).strength(0.7))
    .force("link", d3.forceLink(CONNECTIONS).id(d => d.code).distance(46).strength(0.2))
    .force("collide", d3.forceCollide(MIN_NODE_DISTANCE / 2))
    .stop();
  for (let i = 0; i < 400; i++) sim.tick();

  const svg = d3.select("#course-map svg").attr("width", width).attr("height", height);
  const linkLayer = svg.append("g").attr("fill", "none").attr("stroke-width", 1.5);
  const nodeLayer = svg.append("g");
  const labelLayer = svg.append("g");
  const hitLayer = svg.append("g");

  function colors() {
    const s = getComputedStyle(document.documentElement);
    const v = n => s.getPropertyValue(n).trim();
    return { bg: v("--color-bg"), fg: v("--color-fg"), fgMuted: v("--color-fg-muted"), highlight: v("--chart-1") };
  }

  const categoryInfoDiv = d3.select("#category-info");
  const categoryInfoTemplate = _.template(d3.select("#category-info-template").html());
  const itemInfoDiv = d3.select("#item-info");
  const itemInfoTemplate = _.template(d3.select("#item-info-template").html());

  let currentCategory = CATEGORIES[0];

  const nav = d3.select("#category-nav");
  CATEGORIES.forEach(cat => {
    nav.append("div").html(cat.name).on("click", function () {
      d3.select("#category-nav div.highlight").classed("highlight", false);
      d3.select(this).classed("highlight", true);
      currentCategory = cat;
      render(300);
      categoryInfoDiv.html(categoryInfoTemplate({
        name: cat.name,
        description: cat.description,
        ownCount: cat.items.length,
        total: cat.items.length + (cat.highlightCodes ? cat.highlightCodes.length : 0),
        noHighlight: cat.id === "all"
      }));
    });
  });

  function showItemInfo(event, d) {
    itemInfoDiv.html(itemInfoTemplate({
      code: d.code, title: d.title, category: d.categoryName, path: d.path,
      description: d.description || null, date: d.date || null,
      courses: categoriesReferencingCode[d.code] || []
    }));
    // Highlight only this node's own prerequisites — edges where it's the
    // target (requires something), not edges where it's the source (is a
    // prerequisite for something else). E.g. hovering RS08 highlights
    // RS05→RS08, not RS08→RS09/RS08→RS10/etc.
    const col = colors();
    const isOwnPrereq = conn => conn.to === d.code;
    linkLayer.selectAll("line")
      .transition().duration(150)
      .attr("stroke", conn => (isOwnPrereq(conn) ? col.highlight : col.fgMuted))
      .attr("stroke-width", conn => (isOwnPrereq(conn) ? 3 : 1.5))
      .attr("opacity", conn => (isOwnPrereq(conn) ? 1 : 0.1));
  }
  // No mouseout handler — per request, whatever a hover reveals (the info
  // card and the highlighted prerequisite lines) stays on screen until a
  // different node is hovered, rather than resetting when the mouse leaves.

  function render(duration) {
    const c = colors();

    // A node is highlighted if it's owned by the selected category, or
    // cross-referenced by it via highlightCodes (e.g. selecting ECON 325
    // highlights the Beginner Intro to Statistics nodes it points at).
    // "All" is the one exception: it never highlights anything, even its
    // own nodes — it's a home for uncategorized notebooks, not a filter.
    function isHighlighted(d) {
      if (currentCategory.id === "all") return false;
      return d.categoryId === currentCategory.id ||
        (currentCategory.highlightCodes && currentCategory.highlightCodes.includes(d.code));
    }

    linkLayer.selectAll("line")
      .data(CONNECTIONS, d => d.from + "->" + d.to)
      .join(
        enter => enter.append("line")
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
          .attr("stroke", c.fgMuted)
          .attr("opacity", 0)
          .transition().duration(duration)
          .attr("opacity", 0.5),
        update => update.transition().duration(duration)
          .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y)
          .attr("stroke", c.fgMuted)
          .attr("opacity", 0.5)
      );

    nodeLayer.selectAll("circle")
      .data(allNodes, d => d.code)
      .join(
        enter => enter.append("circle")
          .attr("r", 10)
          .attr("cx", d => d.x).attr("cy", d => d.y)
          .attr("fill", d => (isHighlighted(d) ? c.highlight : c.bg))
          .attr("stroke", d => (isHighlighted(d) ? c.highlight : c.fgMuted))
          .attr("stroke-width", 1.5)
          .attr("opacity", 0)
          .transition().duration(duration).attr("opacity", 1),
        update => update.transition().duration(duration)
          .attr("fill", d => (isHighlighted(d) ? c.highlight : c.bg))
          .attr("stroke", d => (isHighlighted(d) ? c.highlight : c.fgMuted))
      );

    labelLayer.selectAll("text")
      .data(allNodes, d => d.code)
      .join(
        enter => enter.append("text")
          .attr("x", d => d.x).attr("y", d => d.y)
          .attr("text-anchor", "middle").attr("dy", "3px")
          .attr("font-family", "inherit").attr("font-size", 8).attr("font-weight", 600)
          .attr("fill", d => (isHighlighted(d) ? "#ffffff" : c.fg))
          .text(d => d.code),
        update => update.transition().duration(duration)
          .attr("fill", d => (isHighlighted(d) ? "#ffffff" : c.fg))
      );

    hitLayer.selectAll("circle")
      .data(allNodes, d => d.code)
      .join(enter => enter.append("circle")
        .attr("r", 10).attr("fill", "transparent")
        .attr("cx", d => d.x).attr("cy", d => d.y)
        .on("mouseover", showItemInfo));
  }

  render(0);
  categoryInfoDiv.html(categoryInfoTemplate({
    name: currentCategory.name,
    description: currentCategory.description,
    ownCount: currentCategory.items.length,
    total: currentCategory.items.length + (currentCategory.highlightCodes ? currentCategory.highlightCodes.length : 0),
    noHighlight: currentCategory.id === "all"
  }));
  itemInfoDiv.html(itemInfoTemplate({ code: null, title: null, category: null, path: null, description: null, date: null, courses: [] }));
  d3.select("#category-nav div:nth-child(1)").classed("highlight", true);
})();
</script>
