<button id="scroll-to-top" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<style>
#scroll-to-top {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 999;

  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: none;
  border-radius: 50%;

  /* Follows the active Comet theme (light/dark) automatically,
     since these are the same Bootstrap vars compiled from
     comet_theme.scss / comet_theme_dark.scss */
  background-color: var(--bs-primary, #041746);
  color: #FFFFFF;

  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  cursor: pointer;

  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
}

#scroll-to-top.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

#scroll-to-top:hover,
#scroll-to-top:focus-visible {
  background-color: var(--bs-secondary, #CC7A00);
  outline: none;
}

#scroll-to-top svg {
  width: 18px;
  height: 18px;
}

/* Tooltip shown on hover/focus, to the left so it stays in the viewport */
#scroll-to-top::after {
  content: "Back to top";
  position: absolute;
  right: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  white-space: nowrap;
  padding: 4px 10px;
  border-radius: 6px;
  background-color: rgba(0, 0, 0, 0.8);
  color: #FFFFFF;
  font-size: 0.8rem;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

#scroll-to-top:hover::after,
#scroll-to-top:focus-visible::after {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 768px) {
  #scroll-to-top {
    bottom: 20px;
    right: 16px;
    width: 40px;
    height: 40px;
  }
}
</style>

<script>
(function () {
  var btn = document.getElementById("scroll-to-top");
  if (!btn) return;

  var toggleVisibility = function () {
    if (window.scrollY > 300) {
      btn.classList.add("is-visible");
    } else {
      btn.classList.remove("is-visible");
    }
  };

  window.addEventListener("scroll", toggleVisibility, { passive: true });
  toggleVisibility();

  btn.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
