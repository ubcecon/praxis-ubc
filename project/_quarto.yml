filters:
  - answers

format:
  html:
    theme:
      light:
        - default
        - comet_theme.scss
      dark:
        - default
        - comet_theme_dark.scss
    html-math-method: mathjax
    css: styles.css
    toc: true
    anchor-sections: true
    email-obfuscation: javascript
    page-layout: full
    link-external-newwindow: true
    lang: en-GB
    include-in-header: metadata.html
