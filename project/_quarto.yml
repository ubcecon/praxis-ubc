format:
  html:
    theme:
      light:
        - default
        - comet_theme.scss
      dark:
        - default
        - comet_theme_dark.scss
    highlight-style:
      light: comet_theme.json
      dark: comet_theme_dark.json
    html-math-method: mathjax
    css: styles.css
    lightbox:
      match: auto
    toc: true
    anchor-sections: true
    email-obfuscation: javascript
    page-layout: full
    link-external-newwindow: true
    lang: en-GB
    include-in-header: metadata.html
    include-after-body: scroll_to_top.html
