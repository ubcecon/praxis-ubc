<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>Redirect</title>
  <script type="text/javascript">
    var redirects = {"":"../pages/dissemination/dissemination.html"};
    var hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
    var redirect = redirects[hash] || redirects[""] || "/";
    window.document.title = 'Redirect to  ' +  redirect;
    window.location.replace(redirect);
  </script>
</head>
<body>
<!-- praxis-launch-notebook: per-notebook launch button (injected into output HTML at build time) -->
<script>
(function () {
  // Notebooks that get a launch button (path from "docs/", no extension)
  var NOTEBOOKS = [
    "docs/AMNE-376/amne_376_image_embedding",
    "docs/CTree_CEA/political_economy",
    "docs/ECON-227/llm_distributions",
    "docs/OCR/ocr_notebook",
    "docs/SOCI-280/soci_280_bert",
    "docs/SOCI-415/cbdb_dataset",
    "docs/SOCI-415/kinmatrix",
    "docs/SOCI-415/soci_415_network_analysis",
    "docs/hist_workshop/text_embeddings_workshop",
    "docs/image_analysis/image_analysis",
    "docs/intro_to_cnns/intro_to_cnn",
    "docs/intro_to_convolutions/intro_to_convolution",
    "docs/intro_to_deep_learning/intro_to_fundamental_ML",
    "docs/intro_to_transformers/intro_to_transformers"
  ];

  function init() {
    var i = window.location.pathname.indexOf("/docs/");
    if (i === -1) return;
    var rel = window.location.pathname.slice(i + 1).replace(/\.html$/, "");
    if (NOTEBOOKS.indexOf(rel) === -1) return;

    var nb = rel + ".ipynb";
    var repo = "https%3A%2F%2Fgithub.com%2Fubcecon%2Fpraxis-ubc";
    var urlpath = encodeURIComponent("lab/tree/praxis-ubc/" + nb);
    var jupyter = "https://open.jupyter.ubc.ca/jupyter/hub/user-redirect/git-pull?repo=" +
      repo + "&urlpath=" + urlpath + "&branch=praxis-notebooks";
    var colab = "https://colab.research.google.com/github/ubcecon/praxis-ubc/blob/praxis-notebooks/" + nb;

    var wrap = document.createElement("div");
    wrap.className = "btn-group";
    wrap.style.margin = "0.5rem 0 1rem";
    wrap.innerHTML =
      '<button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">' +
        '<i class="bi bi-play-fill"></i> Launch this notebook</button>' +
      '<ul class="dropdown-menu">' +
        '<li><a class="dropdown-item" target="_blank" rel="noopener" href="' + jupyter + '"><i class="bi bi-cloud-check"></i> JupyterOpen</a></li>' +
        '<li><a class="dropdown-item" target="_blank" rel="noopener" href="' + colab + '"><i class="bi bi-google"></i> Colab</a></li>' +
      '</ul>';

    var header = document.getElementById("title-block-header");
    if (header) {
      header.appendChild(wrap);
    } else {
      var main = document.querySelector("main.content") || document.querySelector("main");
      if (main) main.insertBefore(wrap, main.firstChild);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
